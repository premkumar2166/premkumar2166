<svg width="800" height="250" viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.8; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.05); }
      }
      @keyframes pulse-ring {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.03); }
      }
      @keyframes particleFloat1 {
        0% { transform: translate(0, 0) scale(1); opacity: 0.1; }
        50% { transform: translate(-20px, -20px) scale(1.5); opacity: 0.3; }
        100% { transform: translate(0, 0) scale(1); opacity: 0.1; }
      }
      @keyframes particleFloat2 {
        0% { transform: translate(0, 0) scale(1); opacity: 0.1; }
        50% { transform: translate(20px, -30px) scale(1.2); opacity: 0.4; }
        100% { transform: translate(0, 0) scale(1); opacity: 0.1; }
      }
      @keyframes particleFloat3 {
        0% { transform: translate(0, 0) scale(1); opacity: 0.1; }
        50% { transform: translate(30px, 10px) scale(0.8); opacity: 0.2; }
        100% { transform: translate(0, 0) scale(1); opacity: 0.1; }
      }
      @keyframes slideIn {
        from { opacity: 0; transform: translateX(-10px); }
        to { opacity: 1; transform: translateX(0); }
      }
      .node-core { animation: pulse 4s ease-in-out infinite; }
      .tech-ring { animation: pulse-ring 6s ease-in-out infinite; }
      .tech-ring-inner { animation: pulse 6s ease-in-out infinite; }
      .float-group { animation: float 6s ease-in-out infinite; }
      .particle-1 { animation: particleFloat1 8s infinite; }
      .particle-2 { animation: particleFloat2 10s infinite; }
      .particle-3 { animation: particleFloat3 12s infinite; }
      .text-animate-1 { animation: slideIn 1.5s ease-out forwards; }
      .text-animate-2 { animation: slideIn 1.5s ease-out 0.3s forwards; opacity: 0; }
      .text-animate-3 { animation: slideIn 1.5s ease-out 0.6s forwards; opacity: 0; }
    </style>
    
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <linearGradient id="darkGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C6A00" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="250" fill="#050505" rx="10" />

  <!-- Background Glows -->
  <circle cx="100" cy="125" r="200" fill="url(#glow)" />
  <circle cx="700" cy="125" r="150" fill="url(#glow)" />

  <!-- Particles -->
  <g fill="#D4AF37">
    <circle cx="300" cy="50" r="2" class="particle-1" />
    <circle cx="450" cy="200" r="1.5" class="particle-2" />
    <circle cx="600" cy="80" r="2.5" class="particle-3" />
    <circle cx="150" cy="180" r="1" class="particle-1" style="animation-delay: -2s;" />
    <circle cx="550" cy="220" r="1.5" class="particle-2" style="animation-delay: -4s;" />
  </g>

  <!-- Geometric Accents -->
  <path d="M 0 0 L 100 0 L 0 100 Z" fill="url(#darkGold)" opacity="0.1" />
  <path d="M 800 250 L 700 250 L 800 150 Z" fill="url(#gold)" opacity="0.15" />
  
  <rect x="0" y="0" width="800" height="3" fill="url(#gold)" />
  
  <!-- Left Side Bar -->
  <rect x="40" y="65" width="4" height="120" fill="url(#gold)" rx="2" />

  <!-- Texts with sequential slide-in -->
  <g class="text-animate-1">
    <text x="70" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="#F5F5F5" letter-spacing="1.5">PREMKUMAR K</text>
  </g>
  
  <g class="text-animate-2">
    <text x="70" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="#D4AF37" letter-spacing="2">BCA STUDENT | FULL-STACK DEVELOPER | AI/ML ENTHUSIAST</text>
  </g>
  
  <g class="text-animate-3">
    <text x="70" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#A3A3A3" letter-spacing="0.5">Building secure, scalable, and intelligent real-world applications.</text>
  </g>

  <!-- Circular abstract tech node on the right -->
  <g transform="translate(680, 125)" class="float-group">
    <circle cx="0" cy="0" r="50" fill="none" stroke="#8C6A00" stroke-width="1" class="tech-ring" />
    <circle cx="0" cy="0" r="35" fill="none" stroke="#D4AF37" stroke-width="2" class="tech-ring-inner" />
    <circle cx="0" cy="0" r="16" fill="url(#gold)" class="node-core" />
    
    <!-- Nodes orbiting (visual only) -->
    <circle cx="-35" cy="0" r="4.5" fill="#F5F5F5" class="node-core" style="animation-delay: -1s;" />
    <circle cx="17.5" cy="-30.3" r="3.5" fill="#F5F5F5" class="node-core" style="animation-delay: -2s;" />
    <circle cx="17.5" cy="30.3" r="5.5" fill="#F5F5F5" class="node-core" style="animation-delay: -3s;" />
    
    <path d="M -35 0 L -16 0" stroke="#F5F5F5" stroke-width="1.5" opacity="0.5" />
    <path d="M 17.5 -30.3 L 8 -13.8" stroke="#F5F5F5" stroke-width="1.5" opacity="0.5" />
    <path d="M 17.5 30.3 L 8 13.8" stroke="#F5F5F5" stroke-width="1.5" opacity="0.5" />
  </g>
</svg>
