<svg width="800" height="120" viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes slowPulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
      @keyframes sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
      .pulse { animation: slowPulse 4s infinite; }
      .float { animation: float 6s ease-in-out infinite; }
      .sweep { animation: sweep 3s linear infinite; opacity: 0.1; }
    </style>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8C6A00" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <rect width="800" height="120" fill="#0D0D0D" rx="8" />
  
  <!-- Animated Border Bottom -->
  <rect x="0" y="118" width="800" height="2" fill="url(#gold-grad)" />
  <rect x="0" y="118" width="100" height="2" fill="#F5F5F5" class="sweep" />

  <!-- Left Glowing Orb -->
  <circle cx="80" cy="60" r="60" fill="url(#glow)" class="pulse" />
  
  <!-- Visual Concept -->
  <g transform="translate(80, 60)" class="float">
    
  <circle cx="0" cy="-10" r="8" fill="#F5F5F5" />
  <path d="M -15 20 Q 0 0 15 20 Z" fill="none" stroke="#D4AF37" stroke-width="2" />
  <path d="M 10 -5 Q 25 -20 30 -5 Q 15 10 10 -5 Z" fill="none" stroke="#8C6A00" stroke-width="2" />

  </g>

  <!-- Text -->
  <text x="160" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#F5F5F5" letter-spacing="1">SAHAAYAK</text>
  <text x="160" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#D4AF37" letter-spacing="0.5">Digital Healthcare Companion</text>
  
  <!-- Accent Line -->
  <rect x="160" y="100" width="40" height="2" fill="#8C6A00" />
</svg>