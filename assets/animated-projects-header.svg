<svg width="800" height="80" viewBox="0 0 800 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes pulseGlow { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 0.6; transform: scale(1.02); } }
      @keyframes slideLight { 0% { transform: translateX(-800px); } 100% { transform: translateX(800px); } }
      .glow-line { animation: pulseGlow 4s ease-in-out infinite; }
      .light-sweep { animation: slideLight 4s linear infinite; opacity: 0.2; }
    </style>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050505" stop-opacity="0" />
      <stop offset="50%" stop-color="#F5F5F5" stop-opacity="1" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect width="800" height="80" fill="#050505" />
  <rect x="100" y="39" width="600" height="2" fill="url(#gold)" class="glow-line" />
  <rect x="0" y="39" width="800" height="2" fill="url(#sweep)" class="light-sweep" />
  <rect x="250" y="20" width="300" height="40" fill="#050505" />
  <text x="400" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#D4AF37" text-anchor="middle" letter-spacing="4">FEATURED PROJECTS</text>
</svg>