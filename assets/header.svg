<svg width="800" height="250" viewBox="0 0 800 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <linearGradient id="darkGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C6A00" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
  </defs>

  <rect width="800" height="250" fill="#050505" rx="10" />

  <!-- Geometric Accents -->
  <path d="M 0 0 L 100 0 L 0 100 Z" fill="url(#darkGold)" opacity="0.1" />
  <path d="M 800 250 L 700 250 L 800 150 Z" fill="url(#gold)" opacity="0.15" />
  
  <rect x="0" y="0" width="800" height="3" fill="url(#gold)" />
  
  <!-- Left Side Bar -->
  <rect x="40" y="65" width="4" height="120" fill="url(#gold)" rx="2" />

  <!-- Texts -->
  <text x="70" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="46" font-weight="800" fill="#F5F5F5" letter-spacing="1.5">PREMKUMAR K</text>
  
  <text x="70" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#D4AF37" letter-spacing="3">FULL-STACK DEVELOPER</text>
  
  <text x="70" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#A3A3A3" letter-spacing="0.5">Architecting scalable, intelligent, and real-world software solutions.</text>

  <!-- Circular abstract tech node on the right -->
  <g transform="translate(680, 125)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#8C6A00" stroke-width="1" opacity="0.4" />
    <circle cx="0" cy="0" r="30" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.8" />
    <circle cx="0" cy="0" r="15" fill="url(#gold)" />
    <!-- Tech nodes and links -->
    <circle cx="-30" cy="0" r="4" fill="#F5F5F5" />
    <circle cx="15" cy="-26" r="3" fill="#F5F5F5" />
    <circle cx="15" cy="26" r="5" fill="#F5F5F5" />
    <path d="M -30 0 L -15 0" stroke="#F5F5F5" stroke-width="1" opacity="0.5" />
    <path d="M 15 -26 L 10 -10" stroke="#F5F5F5" stroke-width="1" opacity="0.5" />
    <path d="M 15 26 L 10 10" stroke="#F5F5F5" stroke-width="1" opacity="0.5" />
  </g>
</svg>
