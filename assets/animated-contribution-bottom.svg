<svg width="1000" height="80" viewBox="0 0 1000 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes pulseGlow { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; } }
      @keyframes sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
      .glow { animation: pulseGlow 4s ease-in-out infinite; }
      .sweep { animation: sweep 5s linear infinite; opacity: 0.1; }
    </style>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C6A00" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#8C6A00" />
    </linearGradient>
  </defs>
  
  <rect width="1000" height="80" fill="#050505" />
  
  <!-- Left and Right Borders coming down -->
  <rect x="0" y="0" width="2" height="80" fill="#D4AF37" opacity="0.5" />
  <rect x="998" y="0" width="2" height="80" fill="#D4AF37" opacity="0.5" />
  
  <!-- Bottom Border -->
  <rect x="0" y="78" width="1000" height="2" fill="url(#gold-grad)" />
  <rect x="0" y="78" width="200" height="2" fill="#F5F5F5" class="sweep" />
  
  <text x="500" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#A3A3A3" text-anchor="middle" letter-spacing="3">ACTIVITY • CONSISTENCY • PROGRESS</text>
  
  <!-- Glowing subtle accents -->
  <circle cx="50" cy="40" r="4" fill="#D4AF37" class="glow" />
  <circle cx="950" cy="40" r="4" fill="#D4AF37" class="glow" />
</svg>
