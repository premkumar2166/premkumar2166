<svg width="800" height="140" viewBox="0 0 800 140" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
  </defs>

  <!-- Dark Base -->
  <rect width="800" height="140" fill="#050505" rx="8" />
  
  <!-- Subtle inner border -->
  <rect x="1" y="1" width="798" height="138" fill="none" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.3" rx="8" />

  <!-- Abstract Graphic on Left -->
  <path d="M 0 0 L 80 0 L 0 80 Z" fill="url(#gold)" opacity="0.1" />
  
  <!-- Left Accent Bar -->
  <rect x="30" y="30" width="3" height="80" fill="url(#gold)" rx="1.5" />
  
  <!-- Title -->
  <text x="50" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#D4AF37" letter-spacing="2.5">CAREER GOAL</text>
  
  <!-- Text line 1 -->
  <text x="50" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#F5F5F5" letter-spacing="0.5">To become a skilled Full-Stack Developer and AI Engineer,</text>
  
  <!-- Text line 2 -->
  <text x="50" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#A3A3A3" letter-spacing="0.5">building secure, scalable, and intelligent real-world applications.</text>
  
  <!-- Simple tech node on the right -->
  <g transform="translate(730, 70)">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.3" />
    <circle cx="0" cy="0" r="10" fill="url(#gold)" opacity="0.8" />
    <circle cx="0" cy="0" r="3" fill="#050505" />
  </g>
</svg>
